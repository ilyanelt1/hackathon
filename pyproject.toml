[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mts-intern-dashboard"
version = "0.1.0"
description = "Интеллектуальный аналитический дашборд стажировок МГТС"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
